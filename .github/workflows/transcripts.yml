name: Transcripts

# Fetches transcripts from YouTubeTranscript.dev for every episode that has no file in data/transcripts/, then builds
# show notes: links and chapters from the video description, takeaways from the transcript (Anthropic API).
# Runs when data/episodes.js changes on main, or by hand (Actions > Transcripts > Run workflow) against the branch you pick.
# Existing transcript files are never refetched and existing takeaways are never regenerated, so a later run never pays twice.
on:
  push:
    branches: [main]
    paths: ["data/episodes.js"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id (blank = every episode without a transcript)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: transcripts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch transcripts
        env:
          YOUTUBETRANSCRIPT_API_KEY: ${{ secrets.YOUTUBETRANSCRIPT_API_KEY }}
        run: |
          node tools/fetch-transcripts.js ${{ github.event.inputs.episode }} | tee fetch.log || echo "::warning title=Transcripts::fetch stopped early, see the log"
          grep -E '^Done:' fetch.log | sed 's/^/::notice title=Transcripts::/' || true
          { echo '### Transcripts'; echo; echo '```'; cat fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Links and chapters from descriptions
        env:
          YOUTUBETRANSCRIPT_API_KEY: ${{ secrets.YOUTUBETRANSCRIPT_API_KEY }}
        run: |
          node tools/notes-from-descriptions.js --fetch ${{ github.event.inputs.episode }} | tee notes.log || echo "::warning title=Links and chapters::stopped early, see the log"
          grep -E '^Done:' notes.log | sed 's/^/::notice title=Links and chapters::/' || true
          { echo '### Links and chapters'; echo; echo '```'; cat notes.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Takeaways from transcripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node tools/generate-takeaways.js ${{ github.event.inputs.episode }} | tee takeaways.log || echo "::warning title=Takeaways::stopped early, see the log"
          grep -E '^(Done:|Tokens:)' takeaways.log | sed 's/^/::notice title=Takeaways::/' || true
          { echo '### Takeaways'; echo; echo '```'; cat takeaways.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: node tools/check-data.js
      - name: Commit transcripts and show notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transcripts data/transcript-status.json data/video-meta.json data/episodes.js
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          SUMMARY=$(grep -h -m1 '^Done:' fetch.log notes.log takeaways.log | paste -sd '\n' -)
          git commit -m "Add transcripts and show notes" -m "$SUMMARY"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
